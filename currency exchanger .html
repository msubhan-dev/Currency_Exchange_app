<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="curreny exchnger.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      
</head>
<body>
    <div class="container">
        <h2>Currency Convertor</h2>
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input value="100">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/PK/flat/64.png"/>
                        <select name="from">
                         <!--   <option>USD</option>
                            <option>PKR</option>
                            <option>EUR</option>
                            <option>AUD</option>   -->
                        </select>
                    </div>
                </div>
                <i class="fa-solid fa-right-left"></i>
                <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png"/>
                        <select name="to">
                         <!--   <option>USD</option>
                            <option>PK</option>
                            <option>EUR</option>
                            <option>AUD</option>   -->   
                        </select>
                    </div>
                  </div>
                </div>
                    <div 
                        class="msg">1USD = 280PKR
                    </div>
                        <button>Get Exchange Rate</button>
             </form>
            </div>
<script src="countryList.js"></script>     
<script src="App Currency.js"></script>


</body>
</html>
